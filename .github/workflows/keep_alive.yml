name: Keep Alive 24/7 Cloud Bots

on:
  schedule:
    # Run every 10 minutes to maintain active keep-alive
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  keep_alive:
    name: Ping Cloud Instances
    runs-on: ubuntu-latest
    steps:
      - name: Ping GCP Free Tier 24/7 Instance
        run: |
          echo "Health check GCP Compute Engine Always-Free VM..."
          curl -s -f --retry 3 --retry-delay 5 --max-time 15 http://34.148.183.35/api/health || echo "GCP VM check warning"
